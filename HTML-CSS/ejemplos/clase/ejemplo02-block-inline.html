<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de elementos de bloque y en línea</title>
    <style>
        h1,
        p {
            border: 1px solid red;
        }

        span {
            border: 1px solid blue;
        }
    </style>
</head>

<body>
    <h1 style="background-color: aquamarine;">Esto es un encabezado de nivel 1 y es un elemento de bloque</h1>

    <p>Esto es un párrafo y es un elemento de bloque, pero <span>dentro puede tener un span</span>, que es un elmento en
        línea. </p>

</body>

</html>
