<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de CSS en listas</title>
    <style>
        ul#lista-ul {
            /* list-style-type: disc; */
            list-style-type: square;
            list-style-position: inside;
        }

        ul#lista-ul {
            list-style: circle outside;
        }



        ol {
            /* list-style-type: decimal; */
            /* list-style-type: georgian; */
            list-style-type: lower-roman;
        }
    </style>
</head>

<body>

    <h1>Ejemplo de CSS en listas</h1>

    <ul id="lista-ul">
        <li>A</li>
        <li>B</li>
        <li>C</li>
        <li>D</li>
        <li>E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E
            E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E E </li>
    </ul>


    <ol>
        <li>A</li>
        <li>B</li>
        <li>C</li>
        <li>D</li>
        <li>E</li>
    </ol>


</body>

</html>
