<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        div {
            border: 1px solid black;
            padding: 2em;
        }

        div>div {
            border: 1px solid lime;
        }

        p {
            border: 1px solid red;
        }

        #padre {
            background-color: rgb(192, 15, 112);
            color: darkblue;
        }

        #hijo1 {
            background-color: rgb(12 163 42 / 50%);
        }

        #hijo2 {
            /* color: #565664; */
            color: #665;
            /* #665 es igual que #666655*/
        }

        .fondo-google {
            background-color: aquamarine;
            background-image: url(img/logo-google-maps.png);
            background-size: cover;
            background-size: 10%;
            background-position: top;
            background-repeat: no-repeat;
        }
    </style>
</head>

<body>
    <h1>Ejemplo de colores CSS</h1>


    <div id="padre">
        <p>Párrafo en div "padre"</p>
        <div id="hijo1">Primer div "hijo"</div>
        <div id="hijo2">Segundo div "hijo"</div>

    </div>

    <div class="fondo-google">
        <p>Este div tiene un fondo de Google.</p>
    </div>

</body>

</html>
