<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de imágenes en HTML</title>
</head>

<body>
    <h1>Ejemplo de imágenes en HTML</h1>

    <p>Imágenes con img sin utilizar nada más avanzado</p>
    <img src="https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcSfpS0iA5J-ED9u4iAF42GQ1zXicUR2v8Yns8NAmwSU01cMPtipfdd28IKmfG9olaMTFShcOUQsLT0M2YaHk4k1kuzimJqqAQAbBTBw1m2kz6s1pxmiijZ3j2iGOK_PXd6dr-ofZg&usqp=CAc"
        style="height: 100px; width: 100px;" alt="procesador Ryzen">
    <img src="img/procesador.jpg" width="100" height="100" alt="Imagen de procesador boca arriba">


    <p>Imágenes con picture</p>

    <picture>
        <source media="(max-width:600px)" srcset="img/logo-google-maps.png">
        <source media="(max-width:1000px)" srcset="img/procesador.jpg">
        <img src="https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcSfpS0iA5J-ED9u4iAF42GQ1zXicUR2v8Yns8NAmwSU01cMPtipfdd28IKmfG9olaMTFShcOUQsLT0M2YaHk4k1kuzimJqqAQAbBTBw1m2kz6s1pxmiijZ3j2iGOK_PXd6dr-ofZg&usqp=CAc"
            style="height: 100px; width: 100px;" alt="procesador Ryzen">
    </picture>

    <p>Imágenes con figure</p>

    <figure>
        <img src="https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcSfpS0iA5J-ED9u4iAF42GQ1zXicUR2v8Yns8NAmwSU01cMPtipfdd28IKmfG9olaMTFShcOUQsLT0M2YaHk4k1kuzimJqqAQAbBTBw1m2kz6s1pxmiijZ3j2iGOK_PXd6dr-ofZg&usqp=CAc"
            style="height: 100px; width: 100px;" alt="procesador Ryzen">
        <figcaption>Título de la imagen</figcaption>

    </figure>
    <figure>
        <img src="https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcSfpS0iA5J-ED9u4iAF42GQ1zXicUR2v8Yns8NAmwSU01cMPtipfdd28IKmfG9olaMTFShcOUQsLT0M2YaHk4k1kuzimJqqAQAbBTBw1m2kz6s1pxmiijZ3j2iGOK_PXd6dr-ofZg&usqp=CAc"
            style="height: 100px; width: 100px;" alt="procesador Ryzen">
        <figcaption>Título de la imagen</figcaption>

    </figure>


    <p>Imagen junto a enlace que no aporta contenido</p>
    <p>
        <a href="https://www.google.com" target="_blank"><img style="height: 30px;" src="img/logo-google-maps.png"
                alt=""> Ir a google Maps</a>


    </p>


</body>

</html>
